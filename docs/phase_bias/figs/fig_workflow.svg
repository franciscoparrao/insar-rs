<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="180mm" height="78mm" viewBox="0 0 1440 624" font-family="Liberation Sans, Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#24303a"/>
    </marker>
    <marker id="arrAcc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#D55E00"/>
    </marker>
  </defs>

  <!-- ═══ Row 0: inputs ═══ -->
  <g font-size="21" fill="#24303a">
    <rect x="30" y="30" width="200" height="88" rx="10" fill="#f4f6f7" stroke="#24303a" stroke-width="1.6"/>
    <text x="130" y="66" text-anchor="middle" font-weight="bold">Inputs</text>
    <text x="130" y="94" text-anchor="middle" font-size="18">ISCE · LiCSAR · HyP3</text>

    <rect x="300" y="30" width="240" height="88" rx="10" fill="#eef3f8" stroke="#0072B2" stroke-width="1.6"/>
    <text x="420" y="66" text-anchor="middle" font-weight="bold" fill="#0072B2">Wrapped stack</text>
    <text x="420" y="94" text-anchor="middle" font-size="18">complex IfgStack (e<tspan baseline-shift="super" font-size="13">iφ</tspan>)</text>

    <!-- contribution box -->
    <rect x="610" y="16" width="380" height="116" rx="12" fill="#fdf1e7" stroke="#D55E00" stroke-width="3"/>
    <text x="800" y="52" text-anchor="middle" font-weight="bold" font-size="23" fill="#D55E00">Phase-bias correction</text>
    <text x="800" y="80" text-anchor="middle" font-size="18">estimate a₂…aₘ from ~1-yr anchor pairs</text>
    <text x="800" y="104" text-anchor="middle" font-size="18">per-pixel LS on wrapped closures → subtract bias</text>
    <text x="990" y="10" text-anchor="end" font-size="16" font-style="italic" fill="#D55E00">this work</text>

    <rect x="1060" y="30" width="170" height="88" rx="10" fill="#f4f6f7" stroke="#24303a" stroke-width="1.6"/>
    <text x="1145" y="66" text-anchor="middle" font-weight="bold">Unwrap</text>
    <text x="1145" y="94" text-anchor="middle" font-size="18">quality-guided</text>

    <rect x="1290" y="30" width="130" height="88" rx="10" fill="#f4f6f7" stroke="#24303a" stroke-width="1.6"/>
    <text x="1355" y="66" text-anchor="middle" font-weight="bold">2π-jump</text>
    <text x="1355" y="94" text-anchor="middle" font-size="18">correction</text>
  </g>

  <!-- QC callout under contribution box -->
  <g font-size="18" fill="#009E73">
    <path d="M 800 132 L 800 176" stroke="#009E73" stroke-width="1.6" stroke-dasharray="5 4" fill="none"/>
    <rect x="560" y="176" width="480" height="64" rx="10" fill="none" stroke="#009E73" stroke-width="1.6" stroke-dasharray="5 4"/>
    <text x="800" y="202" text-anchor="middle" font-weight="bold">QC: closure-phase RMS before / after</text>
    <text x="800" y="226" text-anchor="middle">wrapped domain — independent of unwrapping (−36% Ñuble)</text>
  </g>

  <!-- Row 0 arrows -->
  <g stroke="#24303a" stroke-width="2" fill="none">
    <path d="M 230 74 L 292 74" marker-end="url(#arr)"/>
    <path d="M 540 74 L 602 74" stroke="#D55E00" marker-end="url(#arrAcc)"/>
    <path d="M 990 74 L 1052 74" stroke="#D55E00" marker-end="url(#arrAcc)"/>
    <path d="M 1230 74 L 1282 74" marker-end="url(#arr)"/>
  </g>

  <!-- connector down: 2π-jump → reference -->
  <path d="M 1355 118 L 1355 300 L 1238 300" stroke="#24303a" stroke-width="2" fill="none" marker-end="url(#arr)"/>

  <!-- ═══ Row 1 (right → left) ═══ -->
  <g font-size="21" fill="#24303a">
    <rect x="1040" y="256" width="190" height="88" rx="10" fill="#f4f6f7" stroke="#24303a" stroke-width="1.6"/>
    <text x="1135" y="292" text-anchor="middle" font-weight="bold">Reference</text>
    <text x="1135" y="320" text-anchor="middle" font-size="18">stable pixel / AOI</text>

    <rect x="720" y="256" width="250" height="88" rx="10" fill="#f4f6f7" stroke="#24303a" stroke-width="1.6"/>
    <text x="845" y="292" text-anchor="middle" font-weight="bold">SBAS inversion</text>
    <text x="845" y="320" text-anchor="middle" font-size="18">OLS · WLS · L1-IRLS</text>

    <rect x="420" y="256" width="230" height="88" rx="10" fill="#f4f6f7" stroke="#24303a" stroke-width="1.6"/>
    <text x="535" y="292" text-anchor="middle" font-weight="bold">Corrections</text>
    <text x="535" y="320" text-anchor="middle" font-size="18">APS / GACOS · deramp</text>

    <rect x="120" y="256" width="230" height="88" rx="10" fill="#eef3f8" stroke="#0072B2" stroke-width="1.6"/>
    <text x="235" y="292" text-anchor="middle" font-weight="bold" fill="#0072B2">Time series</text>
    <text x="235" y="320" text-anchor="middle" font-size="18">displacement · velocity</text>
  </g>

  <!-- Row 1 arrows (right to left) -->
  <g stroke="#24303a" stroke-width="2" fill="none">
    <path d="M 1040 300 L 978 300" marker-end="url(#arr)"/>
    <path d="M 720 300 L 658 300" marker-end="url(#arr)"/>
    <path d="M 420 300 L 358 300" marker-end="url(#arr)"/>
  </g>

  <!-- ═══ Row 2: outputs ═══ -->
  <path d="M 235 344 L 235 400" stroke="#24303a" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  <g font-size="21" fill="#24303a">
    <rect x="80" y="404" width="310" height="88" rx="10" fill="#f4f6f7" stroke="#24303a" stroke-width="1.6"/>
    <text x="235" y="440" text-anchor="middle" font-weight="bold">Outputs</text>
    <text x="235" y="468" text-anchor="middle" font-size="18">GeoTIFF (native writer) · f32 · PyO3</text>
  </g>

  <!-- ═══ Footer: engine properties ═══ -->
  <g font-size="18" fill="#5a6a75">
    <text x="720" y="560" text-anchor="middle">single static binary (3.5 MB) · no Python/GDAL in the core · Rayon parallelism · 233 unit tests</text>
    <text x="720" y="588" text-anchor="middle">numerical parity with MintPy: r = 1.000000 (Fernandina benchmark)</text>
  </g>
</svg>
